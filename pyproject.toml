[project]
name = "python-grpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-observability>=1.80.0",
    "grpcio-tools>=1.80.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-prometheus>=0.62b1",
    "opentelemetry-instrumentation-asyncio>=0.62b1",
    "opentelemetry-instrumentation-grpc>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "protobuf>=6.33.6",
    "pydantic>=2.13.4",
    "setuptools>=82.0.1",
]

[tool.black]
line-length = 79
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git

  | \.mypy_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff.format]
# Overrides and respects trailing commas dynamically 
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=2.1.0",
    "types-grpcio>=1.0.0.20260514",
    "types-protobuf>=7.34.1.20260508",
]

